name: CI

on:
  pull_request:
    branches: [main]

# Cancel any in-progress run for the same branch/PR when a new one starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Must track `requires-python` in pyproject.toml — pip refuses to
      # install the package (and every dependency resolves against the
      # running interpreter) on an older Python, so a mismatch here doesn't
      # just risk subtle behaviour differences, it makes `pip install -e .`
      # fail outright.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Cache the whole virtualenv keyed on the dependency spec, so the heavy
      # installs (torch, sentence-transformers, chromadb, ...) are skipped
      # entirely on a hit rather than just avoiding the wheel download.
      - name: Cache venv
        id: cache-venv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.14-${{ hashFiles('pyproject.toml') }}

      # Embedding models pulled by the RAG/LLM tests live here; caching avoids
      # re-downloading them on every run.
      - name: Cache HuggingFace models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('config/llm.yaml') }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Install
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,llm,live]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint (ruff)
        run: ruff check src tests

      # Coverage floor is set a few points below the measured baseline
      # (~78-79% as of 2026-07) so routine PRs have headroom, while still
      # catching any drastic regression (e.g. a new module added with no
      # tests at all). Ratchet this up over time as coverage improves —
      # don't lower it to make a failing PR pass.
      - name: Test (pytest + coverage gate)
        run: pytest -q --cov=firm --cov-report=term-missing --cov-fail-under=75

  frontend:
    name: Frontend (vitest + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Cache the installed modules so a clean install is skipped on a hit.
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: node-${{ runner.os }}-node20-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Test (vitest)
        run: npm run test -- --run

      - name: Build (tsc + vite)
        run: npm run build

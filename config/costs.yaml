# Cost schedules for firm.costs (ticket P2-04). EVERY value is `verified: false` until the owner confirms it against the broker's
# published schedule. The research agent cannot fetch anything; values below are the author's recollection of public IBKR/Alpaca/exchange
# schedules and are PLACEHOLDERS for review. Source to confirm: IBKR "Commissions" pages (stocks/ETFs tiered; futures), SEC Section 31 fee
# rate advisories, FINRA TAF schedule, Alpaca "Fee schedule". access date: none (no network). Do NOT tune any value on backtest results.
version: 1
verified: false
# Owner decision 2026-10-05: the research cost basis for the ETF path is the Alpaca zero-commission schedule (etf_alpaca); IBKR Pro tiered
# (etf_ibkr) is kept as a reported sensitivity. CAT fee ($0.000001 per executed share, 2026) is negligible and not modelled.
# Broker check 2026-10-05: IBKR Lite is NOT available to Israeli residents, so IBKR means Pro (tiered here as the sensitivity); Alpaca's own page still lists
# old regulatory rates (SEC $22.90/M, TAF $0.000119) but states they are passed through at the regulator's rates, so the current regulator rates below apply.
# Regulatory items (SEC sell fee, FINRA TAF) were verified on 2026-10-05 against the sources noted on each schedule; commissions,
# exchange/clearing fees, spread and impact remain unverified placeholders.
default_spread_fraction: 0.0004        # quoted spread as FRACTION of price when no data given. UNVERIFIED placeholder, not calibrated
impact_k_default: 1.0                  # source formula impact = k * sigma * sqrt(qty/ADV); UNCALIBRATED conservative default, flagged
schedules:
  ibkr_etf:                            # IBKR Pro tiered, US stocks/ETFs, first monthly-volume tier only (<= 300k shares)
    commission: {per_share: 0.0035, min_per_order: 0.35, max_pct_of_value: 0.01}   # first tier; tiers fall to 0.0005 with monthly volume. Matches IBKR pricing page excerpts 2026-10-05; owner to confirm in the account's own fee schedule
    exchange_fees: {per_share: 0.0003}      # = NSCC/DTC clearing 0.00020 (matches IBKR page excerpts) + about 0.0001 exchange placeholder (varies by venue, can be a rebate)
    regulatory_on_sells: {sec_rate_of_value: 0.0000206, taf_per_share: 0.000195, taf_max_per_order: 9.79, verified: true,
                          source: "SEC fee rate advisory FY2026 #2 ($20.60 per million, effective 2026-04-04; was $0.00 from 2025-05-14); FINRA TAF $0.000195/share max $9.79 per trade from 2026-01-01; checked 2026-10-05"}
    verified: false
  alpaca_etf:                          # Alpaca: zero commission; regulatory pass-through on sells (SEC, FINRA TAF) plus a negligible CAT fee
    commission: {per_share: 0.0, min_per_order: 0.0, max_pct_of_value: 1.0, verified: true, source: "Alpaca pricing-and-fees page (forum.alpaca.markets/t/pricing-and-fees/2309): no commissions, clearing paid by Alpaca Securities LLC; checked 2026-10-05"}
    exchange_fees: {per_share: 0.0}
    regulatory_on_sells: {sec_rate_of_value: 0.0000206, taf_per_share: 0.000195, taf_max_per_order: 9.79, verified: true,
                          source: "SEC fee rate advisory FY2026 #2 ($20.60 per million, effective 2026-04-04; was $0.00 from 2025-05-14); FINRA TAF $0.000195/share max $9.79 per trade from 2026-01-01; checked 2026-10-05"}
    verified: false
  ibkr_future:                         # IBKR Pro futures, per contract per side (CME micro/equity-index style)
    commission: {per_contract: 0.85}
    exchange_fees: {per_contract: 1.38}     # exchange + clearing + NFA placeholder; varies by product
    regulatory_on_sells: {}
    verified: false
specs:                                  # InstrumentCostSpec fields by name
  etf_ibkr:    {kind: etf, broker: ibkr, multiplier: 1.0, half_spread_bps: null, impact_k: 1.0, roll_spreads_per_roll: 2}
  etf_alpaca:  {kind: etf, broker: alpaca, multiplier: 1.0, half_spread_bps: null, impact_k: 1.0, roll_spreads_per_roll: 2}
  mes_ibkr:    {kind: future, broker: ibkr, multiplier: 5.0, half_spread_bps: null, impact_k: 1.0, roll_spreads_per_roll: 2}

# ──────────────────────────────────────────────────────────────
#  Paper trading — Alpaca parallel instance (2026-08-05).
#  Deliberately mirrors config/live.yaml (same strategies/universe/risk
#  envelope) so the two paper accounts are a true side-by-side comparison of
#  broker execution quality, not two different experiments. Run via a
#  separate firm-api process (own port/FIRM_DATA_DIR) — see
#  deploy/ai-trading-alpaca.service. Requires ALPACA_API_KEY/
#  ALPACA_SECRET_KEY/ALPACA_PAPER in .env.
#  Monitor live at: http://localhost:8001/live
# ──────────────────────────────────────────────────────────────

experiment:
  name: "paper_12_strategy_alpaca"
  description: "Mirrors paper_12_strategy (config/live.yaml) on Alpaca instead of IBKR, for a same-strategy broker comparison."
  start_date: "2026-08-05"
  end_date: "2026-08-12"

broker: "alpaca_paper"
# Hourly-during-market-hours cadence (2026-09-18): ~7 cycles/trading day
# (9:30 open, then hourly on the half-hour 10:30-14:30, then a 15:50
# close-anchor) in place of the old once/day market_open-only run — see
# firm.live.scheduler's "hourly_market_hours" composite schedule, which
# registers the open/intraday/close legs as three separate APScheduler
# jobs restricted to RTH (no wasted off-hours fetch), each passing an
# explicit cycle_type down through LiveTradingEngine.run_cycle to
# Orchestrator.step. Rolled out to both live instances together (this
# file and config/live.yaml) per the same decision.
schedule: "hourly_market_hours"
# Cron timezone for market_open / market_close / hourly_market_hours (US
# equity RTH). Also buckets daily trade/turnover limits and
# decision-memory dates.
schedule_timezone: "US/Eastern"
# LiveTradingEngine only recognises "full_auto" / "semi_auto" — anything else
# (e.g. plain "auto") silently falls through to "everything needs approval".
approval_mode: "full_auto"

# LLM-enhanced reasoning (config/llm.yaml's agent_modes) is restricted to
# the day's open/close cycles only; every intraday/hourly cycle forces
# cache_only (no live LLM calls) regardless of agent_modes — see
# Orchestrator._apply_cycle_llm_mode. Without this, running the full
# pipeline hourly during market hours would multiply LLM API cost ~7x/day.
# true is the deliberate default matching the 2026-09-18 decision to keep
# LLM cost flat despite the new cadence above; set false to fall back to
# plain agent_modes behavior on every cycle without reverting the
# schedule itself. Applies per-sleeve too (capital_allocation_mode:
# sleeved below) since _llm_enhanced_agents() also covers sleeve_traders.
llm_open_close_only: true

# Broker-side stop-loss (firm.agents.execution.ExecutionAgent) — the
# faster, broker-resident complement to risk.stop_loss_overlay below: this
# one can fire *between* cycles, not just at the next scheduled decision.
# Same strategies/threshold, same insurance-not-alpha rationale (see
# risk.stop_loss_overlay's comment). Only fires on a flat->open transition
# (see ExecutionAgent._is_fresh_open) and, in sleeved mode, only on the
# final netted execution pass — see its own docstring for why. Top-level,
# not nested under risk: — ExecutionAgent reads this from the same merged
# engine config Orchestrator/RiskAgent get, not the risk: sub-block.
protective_orders:
  mean_reversion:
    stop_loss_pct: 0.07
  stat_arb:
    stop_loss_pct: 0.07

# Per-strategy capital sleeves (see docs/capital_sleeves_plan.md) — enabled
# on this Alpaca instance ONLY (2026-09-10), with IBKR (config/live.yaml)
# deliberately left on "blended" as the static control, mirroring this
# session's other Alpaca-only A/B work (the sector scanner, 8/30). This is
# the one deliberate divergence from this file's "exact mirror of
# config/live.yaml" header comment above — every other knob still matches.
# Seeded from existing per-strategy attribution at cutover via
# POST /api/live/sleeves/seed (must be called once, before the first
# post-restart cycle, or every sleeve starts from zero positions instead).
capital_allocation_mode: sleeved

# ──────────────────────────────────────────────────────────────
# Adaptive per-sleeve capital reweighting (firm.live.capital_reallocation)
# — DISABLED. `strategy_capital_weights` above is a static
# split fixed at cutover; when enabled, this periodically recomputes it
# from each sleeve's own trailing `metric` (via Orchestrator.
# get_sleeve_metrics(), the same numbers GET /api/live/attribution
# reports), tilted toward better recent risk-adjusted performance and
# floor/cap-clamped so one bad or good stretch can't swing the whole
# book. Even when enabled, this only computes and logs a recommendation
# on the configured cadence (see firm.live.capital_reallocation_job) —
# it never reallocates capital by itself. A human reviews
# GET /api/live/capital-reallocation/recommendation and applies it
# explicitly via POST .../apply, or doesn't.
#
# Not yet validated against historical data — leave disabled until that
# pass happens (see docs/capital_sleeves_plan.md for this instance's own
# validate-before-cutover precedent).
# ──────────────────────────────────────────────────────────────
capital_reallocation:
  enabled: false
  day_of_week: sun
  hour: 6
  metric: sortino_ratio
  floor_pct: 0.03
  cap_pct: 0.35
  min_track_days: 30
  tilt_strength: 0.25

# Live cycles read ``data/cache/combined/fundamentals`` only (no per-cycle API).
# firm-api refreshes that cache daily at fundamentals_refresh_hour and at boot
# when older than FIRM_FUNDAMENTALS_REFRESH_MAX_AGE_HOURS (default 24).
fundamentals_refresh_hour: 8

# Daily ingestion of recent news article text into the RAG "news" collection
# (see firm.rag.ingestors.news_ingestor.NewsIngestor + the new
# firm.live.news_ingestion_job scheduler entrypoint, 2026-09-20). The
# sentiment/fundamental analysts and bull/bear/risk LLM agents already query
# this collection via _retrieve_context (config/llm.yaml sets llm_enhanced
# for sentiment/fundamental) but it sat at zero documents in production
# without this job, so every such call was silently falling back to
# quant-only. Retrieved "news" text is anonymized (company name + ticker
# stripped, see firm.agents.llm.news_anonymizer) before it reaches any LLM
# prompt, per Glasserman & Lin (arXiv 2309.17322)'s look-ahead/distraction
# mitigation for LLM-read news sentiment.
#
# Enabled on this Alpaca instance ONLY (2026-09-20), IBKR (config/live.yaml)
# deliberately left off as the static control — mirroring this session's
# other Alpaca-first rollouts (sector scanner 8/30, capital sleeves 9/10).
# Verified end-to-end with real data before enabling: a manual
# NewsIngestor.ingest(["AAPL"], days=3) run against the live Massive API key
# (Yahoo RSS/Tiingo were rate-limited/permission-denied in that one check,
# but the fallback chain's Massive leg fetched real article title+
# description text and wrote 18 new chunks into the "news" collection, with
# correct symbol/doc_type/date metadata) confirms the pipeline genuinely
# works against production credentials, not just against mocks.
# "hour" is the daily fire time in schedule_timezone; "days" is the
# lookback window per run (safe to overlap runs — VectorStore.add_documents
# dedupes by content hash, so no duplicate ingestion cost).
news_ingestion:
  enabled: true
  hour: 7
  days: 3
strategies:
  enabled:
    - momentum
    - trend
    - mean_reversion
    - stat_arb
    - multi_factor
    - sentiment
    - event_driven
    # ml_prediction — disabled: overfit risk on 25-name universe (IC audit)
    - volatility_breakout
    - seasonality
    # gann — permanently disabled; no timing value on any asset class tested
    - regime_hmm
    # danelfin_ai_score / danelfin_live_signals / danelfin_best_stocks_signal —
    # removed 2026-08-16: user closed their Danelfin account. See
    # docs/investing_pro_integration.md and docs/danelfin_best_stocks_arm.md
    # for the prior A/B history if this vendor is ever reinstated.
    # pattern_recognition (Strategy #13) — enabled 2026-09-09, see
    # docs/pattern_recognition_plan.md.
    - pattern_recognition
  auto_approve:
    - momentum
    - trend
    - mean_reversion
    - stat_arb
    - multi_factor
    - sentiment
    - event_driven
    - volatility_breakout
    - seasonality
    - regime_hmm
    - pattern_recognition

# Per-strategy parameters passed to build_orchestrator via strategy_params.
strategy_params:
  stat_arb:
    require_cointegration: true
    coint_pvalue: 0.10
    max_pairs: 5
    entry_z: 2.0
    exit_z: 0.5
    lookback_days: 60
    # Sector/thematic anchors — avoids correlation-mining across the full universe.
    predefined_pairs:
      - ["SPY", "QQQ"]
      - ["SPY", "IWM"]
      - ["AAPL", "MSFT"]
      - ["JPM", "BAC"]
      - ["XOM", "CVX"]
      - ["GOOG", "META"]
  # CNN/GAF chart-pattern quality scorer (2026-09-20) -- off by default in
  # firm.strategies.pattern_recognition itself (model-file presence alone
  # must never imply live usage, see the strategy's own default_params
  # docstring), enabled here after a real walk-forward validation: a model
  # trained on real cached history (2010-2025, not the CLI's synthetic
  # smoke-test default the prior on-disk artifact was suspected to be)
  # against 2010-06-01 to 2023-12-31 improved pattern_recognition's own
  # Sharpe 0.415->0.645, total return 4.9%->7.7%, hit rate 49.3%->51.7%
  # (max drawdown fractionally worse, 3.85%->4.12%, both small in absolute
  # terms). One walk-forward window, not this codebase's usual 3-window
  # robustness check (see rebalance_band_pct/rebalance_fraction's own
  # comments for that gold standard) -- revisit if live results diverge.
  pattern_recognition:
    cnn_scoring_enabled: true

universe:
  symbols:
    # Mega-cap tech
    - AAPL
    - MSFT
    - NVDA
    - GOOG
    - AMZN
    - META
    # Growth / momentum
    - TSLA
    - AVGO
    - AMD
    - CRM
    - NFLX
    - ADBE
    # Financials
    - JPM
    - GS
    - BAC
    - V
    - MA
    # Healthcare / defensives
    - JNJ
    - UNH
    - LLY
    # Energy
    - XOM
    - CVX
    # ETFs — stat-arb anchors + regime proxy
    - SPY
    - QQQ
    - IWM

rebalance_frequency: "daily"
# Must match the actual Alpaca paper account equity ($100k default) — this
# seeds peak_equity for the drawdown kill switch, and a mismatch here
# (previously copied from live.yaml's $1M) trips it immediately on boot.
initial_capital: 100_000

# Live cycle timeouts (seconds). Hard timeout releases the cycle lock so a
# hung LLM/IBKR call cannot block every future scheduled cycle.
cycle_hard_timeout_seconds: 900
cycle_watchdog_seconds: 1800
# Broker & host failover (see docs/PROJECT_CONTEXT.md "Broker & host
# failover"). A broker call failing mid-cycle triggers one inline reconnect
# attempt on the cycle worker thread; after this many *consecutive* cycles
# still failing despite reconnect attempts, the alert escalates from
# "broker_unavailable" to the louder "broker_disconnected_sustained" (likely
# needs a human — IB Gateway down/logged out, or a host issue).
broker_disconnect_alert_threshold: 3
# Per-analyst wall-clock cap inside the orchestrator parallel pool.
analyst_timeout_seconds: 300
# Bull/bear/debate/trader/risk/execution stage cap (defaults to analyst timeout).
orchestrator_stage_timeout_seconds: 300
# Pre-import HMM / RAG stacks before the first catch-up cycle.
pipeline_warmup: true

# ──────────────────────────────────────────────────────────────
# Risk — realistic live-account constraints
# These are the numbers you would actually enforce on a live
# account, so paper P&L is a valid predictor of live results.
# ──────────────────────────────────────────────────────────────
risk:
  # Live-engine circuit breakers
  kill_switch_drawdown: 0.08    # halt at 8% portfolio drawdown — standard retail hard stop
  max_daily_trades: 40          # realistic order count before costs eat alpha
  max_daily_turnover: 0.25      # 25% of NAV/day — high-frequency edge is rare at this scale

  # Risk-agent position and exposure limits
  max_position_pct: 0.05        # 5% single-stock cap — institutional standard
  max_gross_exposure: 1.5       # 1.5× gross — modest leverage, survives gap risk
  max_net_exposure: 0.50        # 50% net long — mild long bias, not market-neutral
  max_sector_pct: 0.25          # 25% sector cap — diversification guardrail
  vol_target: 0.12              # 12% annualised vol target — conservative live baseline
  # Was silently dead code: nothing in the real orchestrator path ever
  # supplied inputs["vol_estimates"], so vol_target above never actually
  # enforced anything despite reading like an active control. RiskAgent
  # now self-computes vol estimates from ctx.pit_view when this is true
  # (see RiskAgent._estimate_vol_estimates) -- de-risk only, never levers
  # up past the other caps, so safe to enable unconditionally.
  vol_targeting_enabled: true
  vol_lookback_days: 60
  max_drawdown_pct: 0.15        # 15% per-strategy drawdown before it is sized down

  # ADV/participation-rate liquidity cap: clips the implied trade size (not
  # the resting position) to this fraction of a symbol's trailing 20-day
  # average daily dollar volume. 10% is a standard conservative desk limit —
  # this account is small relative to the mega-cap universe's ADV, so it's
  # a backstop against illiquid/halted names rather than a routine binding
  # constraint. See RiskAgent._cap_liquidity.
  max_participation_pct: 0.10
  adv_lookback_days: 20

  # Pairwise-correlation concentration cap: same-direction positions with
  # 60-day return correlation above this threshold have their combined
  # weight capped, catching cross-sector correlated risk max_sector_pct
  # misses (e.g. two rate-sensitive names in different GICS sectors).
  # Unlike the liquidity cap this CAN bind under normal trending regimes
  # (many large caps correlate >0.75 with broad market beta), so it's
  # enabled here (pre-launch, no live track record to preserve) but left
  # off in settings.yaml to keep the already-documented backtest numbers in
  # docs/portfolio_construction_diagnosis.md comparable. See
  # RiskAgent._cap_correlated_exposure.
  correlation_threshold: 0.75
  max_correlated_pair_pct: 0.25
  correlation_lookback_days: 60

  # Optional CVaR (Conditional Value-at-Risk / Expected Shortfall) tail-risk
  # sizing overlay — complements vol_target's diagonal-covariance estimate
  # with a distributional tail read (two books with identical variance can
  # have very different downside severity). Off by default pending a
  # dedicated A/B, like the other new Phase-4 research item. See
  # RiskAgent._cvar_overlay / firm.eval.metrics.conditional_value_at_risk.
  # cvar_limit: 0.03
  # cvar_confidence: 0.95
  # cvar_lookback_days: 60

  # Factor-exposure overlay (market beta / momentum) — catches a book that
  # clears every per-name/sector cap above while still being one
  # concentrated bet on a shared factor (e.g. several high-beta,
  # momentum-tilted names). Off by default pending a dedicated backtest
  # validation pass — do not enable without first reviewing
  # RiskAgent.last_factor_exposures (or `report: true` below) against real
  # cycles. See RiskAgent._factor_risk_overlay / firm.agents._factor_risk.
  # factor_risk:
  #   enabled: false
  #   report: false          # true: compute + log exposures, no enforcement
  #   benchmark_symbol: SPY
  #   max_beta_exposure: 1.2
  #   max_momentum_exposure: 0.6
  #   beta_lookback_days: 60
  #   momentum_lookback_days: 60

  # Per-position stop-loss for mean_reversion/stat_arb — both strategies'
  # own docstrings call for one ("reversals can fail spectacularly during
  # momentum-driven crashes") but neither the strategy layer nor this agent
  # ever implemented it, and a walk-forward audit (9/17) found both are the
  # worst live performers, consistent with an extended trending regime that
  # a pure divergence bet has no way to exit early from. Sleeved mode (this
  # instance) gives it exact per-strategy positions to check, unlike blended
  # (IBKR), which has to fall back to the dominant-strategy heuristic.
  #
  # Enabled 2026-09-19 as risk insurance, not a validated alpha claim: a
  # full 11-strategy live-parity backtest (see docs/PROJECT_CONTEXT.md)
  # could not reproduce live's actual mean_reversion/stat_arb losses either
  # way, so this isn't shipped because backtesting proved it helps — it's
  # shipped because these two strategies still have no mechanism to cap a
  # bad move, which their own docstrings call a known, named risk. Revisit
  # if it turns out to be costing more than it saves on an otherwise-healthy
  # run.
  stop_loss_overlay:
    enabled: true
    strategies: [mean_reversion, stat_arb]
    max_loss_pct: 0.07

  # Per-strategy override of the exposure/veto envelope above, for a sleeve
  # whose OWN book is inherently concentrated by design (capital_allocation_
  # mode: sleeved runs each strategy's risk check against only that
  # strategy's own signals — see Orchestrator._step_sleeved). REAL INCIDENT
  # (2026-09-19): stat_arb trades at most 5 pairs (strategy_params.stat_arb.
  # max_pairs)/10 legs, so on a typical day with only 2-4 active legs, each
  # leg legitimately needs 30-90% of the sleeve's OWN capital -- the shared
  # max_position_pct (5%, sized for the diversified ~25-name blended book)
  # clipped that so hard it tripped the 50% veto_threshold on EVERY single
  # stat_arb sleeve decision since sleeved mode began on 9/10 (confirmed via
  # journalctl: 9/9 logged decisions were VETOs, 0 approved) -- the sleeve
  # had been silently frozen on its 9/10-cutover seed positions for over a
  # week, never once acting on a real signal. 50%/0.95 is generous enough
  # for a 2-leg-concentrated day while still catching a truly degenerate
  # (near-100%-one-name) proposal. See RiskAgent.sleeve_risk_overrides.
  sleeve_risk_overrides:
    stat_arb:
      max_position_pct: 0.50
      max_gross_exposure: 2.0
      veto_threshold: 0.95
    # REAL INCIDENT (found 2026-09-21, same root cause/pattern as stat_arb
    # above): event_driven only signals on symbols with a recent earnings
    # surprise (strategies/event_driven.py) -- on a typical day that's just
    # 3-4 names out of the whole universe, so each legitimately needs
    # 15-40%+ of the SLEEVE's own capital. Confirmed via journalctl: every
    # logged event_driven sleeve decision back to at least 9/15 was a VETO
    # (clipping severity 76-80%, e.g. PCG -42%/CRM +28%/AVGO +35%) -- the
    # sleeve had been silently frozen, never once acting on a real earnings
    # signal for 6+ days.
    event_driven:
      max_position_pct: 0.50
      max_gross_exposure: 2.0
      veto_threshold: 0.95
    # volatility_breakout only signals on symbols that just broke out of a
    # vol squeeze (strategies/volatility_breakout.py) -- usually 0-2 names
    # out of the whole universe, so a single name can legitimately need
    # 50-100% of the sleeve's own capital. Same root cause as stat_arb/
    # event_driven above.
    volatility_breakout:
      max_position_pct: 0.50
      max_gross_exposure: 2.0
      veto_threshold: 0.95

  # GICS-style sector tags for the 25-name universe (enables max_sector_pct).
  sector_map:
    AAPL: technology
    MSFT: technology
    NVDA: technology
    GOOG: communication
    AMZN: consumer_discretionary
    META: communication
    TSLA: consumer_discretionary
    AVGO: technology
    AMD: technology
    CRM: technology
    NFLX: communication
    ADBE: technology
    JPM: financials
    GS: financials
    BAC: financials
    V: financials
    MA: financials
    JNJ: healthcare
    UNH: healthcare
    LLY: healthcare
    XOM: energy
    CVX: energy
    SPY: etf
    QQQ: etf
    IWM: etf

  # HMM regime overlay — live-equivalent exposure scaling
  regime_overlay:
    enabled: true
    benchmark_symbol: "SPY"
    n_states: 3
    retrain_frequency: 5        # refit weekly
    lookback_days: 252
    # `ensemble: true` swaps in the 5-seed majority-vote regime detector
    # (firm.regime.ensemble.EnsembleRegimeModel). Only A/B'd against
    # strategy_regime_weights so far (docs/regime_ensemble_scoping.md) —
    # not this overlay specifically — so left false pending its own A/B.
    ensemble: false
    exposure_map:
      Bull: 1.3                 # modest lever in confirmed bull (not aggressive)
      Bear: 0.4                 # meaningful de-risk in bear
      Chop: 0.7                 # slightly reduced in indeterminate regime
    # Separation-based damping (mirrors the per-symbol regime_hmm strategy's
    # min_state_separation/separation_damping_floor): a label statistically
    # indistinguishable from its neighbour is label-switching risk, so its
    # effect on gross exposure is pulled back toward a no-op rather than
    # applying the full playbook factor at full confidence.
    min_state_separation: 0.5
    separation_damping_floor: 0.15

  # Floor on the *composed* gross-exposure scale across regime/seasonality/
  # macro overlays together — see config/live.yaml's matching comment and
  # docs/remediation_progress.md #67. 0.25 is also the RiskAgent code
  # default; listed here for visibility.
  overlay_scale_floor: 0.25

# ──────────────────────────────────────────────────────────────
# Dynamic universe growth — general-purpose mechanism (not Danelfin-specific
# in its own persistence/engine API — see firm.live.dynamic_universe_state
# and LiveTradingEngine.update_universe/update_sector_map), driven here by
# Danelfin's real /v3/beststocks list (firm.live.danelfin_universe_sync).
# Disabled by default (explicit opt-in, matching every other risk-bearing
# toggle in this file) — the user asked for this because a static universe
# "doesn't make sense in general", and to give danelfin_best_stocks_signal
# more than the small overlap it gets against the fixed universe below, but
# it carries a real residual risk this project is not hiding: turnover cost
# from list churn even with the dwell delay below, and exposure to
# smaller/less-liquid names than the rest of the universe. Review at least
# one real cycle's dry-run log output (danelfin_universe_sync's INFO-level
# additions/removals) before flipping enabled: true for real.
danelfin_dynamic_universe:
  enabled: false
  state_path: "data_alpaca/dynamic_universe_state.json"
  max_dynamic_symbols: 10        # hard cap on total dynamically-held symbols
  min_dwell_days_before_removal: 5   # consecutive absent days before a dynamic symbol is dropped

# ──────────────────────────────────────────────────────────────
# Sector-balanced dynamic universe — see config/live.yaml's twin block for
# the full design/rationale (firm.live.sp500_universe_sync). Enabled HERE,
# on this engine only, per the forward paper A/B this was scoped for: this
# Alpaca book runs the sector-balanced dynamic universe, the IBKR book
# (config/live.yaml) stays on the static 25-name universe as the control —
# same pattern as the existing LLM A/B split. Reviewed via a real dry-run
# simulation before enabling (2026-08-30, real AlpacaProvider prices + a
# live GitHub sector-cache refresh — see project memory for the picks).
sp500_dynamic_universe:
  enabled: true
  state_path: "data_alpaca/dynamic_universe_state.json"
  sector_cache_path: "data_alpaca/sp500_sector_map.json"
  max_dynamic_symbols: 10
  min_dwell_days_before_removal: 5
  liquidity_lookback_days: 30
  sector_cache_refresh_day: "sun"
  # Incubation period (2026-09-20): a newly-added candidate symbol is
  # capital-locked (RiskAgent.incubating_symbols zeroes its target weight,
  # upstream signals still run normally) for this many consecutive days
  # before real capital can touch it -- the entry-side "buffer zone"/
  # "incubation" convention, sized to match min_dwell_days_before_removal's
  # exit-side dwell delay. Strictly more conservative than pre-incubation
  # behavior (a candidate gets LESS exposure, never more), so safe to
  # enable directly rather than ship disabled first.
  incubation_days: 5

# ──────────────────────────────────────────────────────────────
# Transaction costs — must match your actual broker schedule
# IBKR Tiered: ~$0.005/share; modelled here as pct of notional
# ──────────────────────────────────────────────────────────────
costs:
  commission_pct: 0.0005        # 0.05% — realistic IBKR tiered rate
  slippage_pct: 0.0005          # 0.05% — flat baseline slippage (quote/latency noise)
  spread_pct: 0.0002            # 0.02% — approx. cost of crossing the bid-ask spread
  # Size/volume-aware market-impact cost, ON TOP of the flat rates above —
  # those don't scale with order size relative to a name's trading volume,
  # so a trade that's a large fraction of ADV was priced the same as a tiny
  # one. Square-root law: impact_pct = market_impact_coefficient *
  # sqrt(trade_notional / ADV_dollars). 0.005 ~= 0.5% impact at 100% of ADV,
  # ~0.16% at the risk.max_participation_pct cap below (10% of ADV) — a
  # conservative starting calibration; tune from realised IBKR fills once
  # available. See firm.agents._liquidity.market_impact_pct. Shares
  # risk.adv_lookback_days for its trailing-volume window (same ADV
  # definition as the liquidity cap below).
  market_impact_coefficient: 0.005
  # Optional linear-below/sqrt-above crossover participation rate — empirical
  # work shows impact is closer to linear for small orders, sqrt only
  # dominating at higher participation; this account's trades are small
  # relative to the mega-cap universe's ADV, so they likely sit in the
  # linear-dominant regime and a flat sqrt coefficient may overstate their
  # cost. Unset (None) = pure sqrt law at every size, unchanged. Uncomment
  # once calibrated from realised fills:
  # market_impact_crossover_participation: 0.1
  # Short-borrow fees are NOT simulated live: IBKR charges/reports real
  # borrow costs against the account directly, so there is nothing to
  # estimate here (unlike the backtest, which has no real broker to charge
  # it). See firm.config.BacktestConfig.short_borrow_annual_pct.
  # No-trade / rebalance band (see firm.agents.execution.ExecutionAgent):
  # |target_w - current_w| must exceed this fraction of NAV before an order
  # is generated at all. Mirrors config/live.yaml — validated via a 3-window
  # backtest comparison (2024-Q1/2022-Q1/2023-Q3, live-faithful config):
  # 0.05 cut daily turnover 44-73% and improved/held drawdown in every
  # window, with Sharpe improving in 2/3 and a noise-level wash in the
  # third. Keep below 2x risk.max_position_pct (0.05 below) — a band at or
  # above that is mechanically unreachable and would silently freeze the
  # book forever.
  rebalance_band_pct: 0.05
  # Turnover-aware sizing -- mirrors config/live.yaml. Validated via a
  # 3-window comparison (2024-Q1/2022-Q1/2023-Q3): 0.7 gave a clean Sharpe
  # improvement over the band-only baseline in all 3 windows while cutting
  # turnover another 34-54% beyond the band.
  rebalance_fraction: 0.7

# ──────────────────────────────────────────────────────────────
# Macro-event blackout (news-guard) — pre-trade gate
# Holds orders whose instrument sits inside a high-impact economic
# event window (FOMC / NFP / CPI / ECB / BoE). Default OFF.
# ──────────────────────────────────────────────────────────────
news_guard:
  enabled: true                 # set true to arm the blackout gate
  before_min: 30                # minutes before an event to start holding
  after_min: 15                 # minutes after an event to keep holding
  offline: false                # true = use only the bundled events.csv
  source: forexfactory          # forexfactory (default, free/keyless) | investing
                                 # (richer coverage via the opt-in Investing.com
                                 # scraper — requires INVESTING_SCRAPER_ENABLED=1
                                 # in .env; a fetch failure falls through to
                                 # forexfactory then the bundled CSV either way,
                                 # see firm.live.news_guard.load_events)

# ──────────────────────────────────────────────────────────────
# Signal combination (research stage)
#   confidence = confidence-weighted mean (legacy default)
#   optimal    = inverse-covariance weighting (down-weights correlated /
#                poor-performing strategies); requires per-strategy return
#                history, which live attribution now tracks unconditionally.
#
# Set to `optimal` per docs/portfolio_construction_diagnosis.md: a 3-window
# A/B (2026-07-26) showed `optimal` beat `confidence` on portfolio Sharpe in
# every tested window (never worse), including one large improvement
# (0.16 -> 1.00). Falls back to confidence-equivalent weighting automatically
# when return history is too thin (see agents/research/_combine.py).
# ──────────────────────────────────────────────────────────────
signal_combination:
  method: optimal

# ──────────────────────────────────────────────────────────────
# Generic per-strategy rolling-Sharpe circuit breaker (research/_circuit_breaker.py)
#   Damps (never fully zeroes) a strategy's raw signal contribution when its
#   trailing realized Sharpe is persistently and materially negative —
#   complementary to `optimal` above, which has no notion of edge *sign*.
#   Motivated by regime_hmm's negative Sharpe in 6/6 diagnostic windows.
#
# DISABLED: an A/B with these exact thresholds over the same 3 diagnostic
# windows found it net *hurt* portfolio Sharpe in all 3 (over-gated several
# volatile-but-legitimate strategies via a noisy 60-day trailing Sharpe on
# short windows). Kept here for future calibration/research, not enabled.
# See docs/portfolio_construction_diagnosis.md.
# ──────────────────────────────────────────────────────────────
strategy_circuit_breaker:
  enabled: false
  lookback_days: 60
  min_track_record_days: 20
  trigger_sharpe: -0.5
  full_cutoff_sharpe: -1.5
  damping_floor: 0.25

# ──────────────────────────────────────────────────────────────
# Regime-conditional strategy multipliers (experimental)
#   Scales each strategy's raw signal before bull/bear combine based on
#   the prevailing market regime (Bull/Bear/Chop). Disabled by default —
#   calibrate via scripts/calibrate_strategy_regime_weights.py before enabling.
#   `ensemble: true` swaps the single-model regime detector for a 5-seed
#   majority-vote ensemble (firm.regime.ensemble.EnsembleRegimeModel) — A/B'd
#   in docs/regime_ensemble_scoping.md: calms regime_hmm's own noise but does
#   NOT improve portfolio Sharpe with this feature enabled, so left false.
# ──────────────────────────────────────────────────────────────
strategy_regime_weights:
  enabled: false
  ensemble: false
  benchmark_symbol: SPY
  lookback_days: 252
  retrain_frequency: 21
  weights:
    Bull:
      momentum: 1.2
      trend: 1.2
      mean_reversion: 0.8
    Bear:
      stat_arb: 1.2
      mean_reversion: 1.1
      momentum: 0.7
      trend: 0.7
    Chop:
      regime_hmm: 0.5
      volatility_breakout: 0.8

# ──────────────────────────────────────────────────────────────
# Portfolio allocation (TraderAgent)
#   allocation_method: conviction_weighted | equal_weight | risk_parity | kelly
#   kelly_fraction is only used when allocation_method: kelly (half-Kelly = 0.5)
#   conviction_smoothing: EMA on each symbol's net_conviction across cycles.
#   Confirmed live 2026-08-03 through 2026-08-07: with TraderAgent's
#   max_positions default (20) landing at the universe size, the average
#   position sits exactly at risk.max_position_pct by construction, so
#   unsmoothed day-to-day signal noise pushed most of the book to its
#   per-name cap on both sides every cycle — 60-95% daily turnover against a
#   nominal 25% cap. Halflife of 3 trading days damps that without
#   materially lagging a real regime change.
# ──────────────────────────────────────────────────────────────
allocation_method: conviction_weighted
kelly_fraction: 0.5
conviction_smoothing_enabled: true
conviction_smoothing_halflife_days: 3.0

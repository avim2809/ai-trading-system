# Default to a FREE model. Options that cost nothing to run:
#   groq/llama-3.3-70b-versatile               – free Groq tier, needs a free GROQ_API_KEY
#   gemini/gemini-2.0-flash                    – Google Gemini, needs GEMINI_API_KEY
#   openrouter/nvidia/nemotron-3-ultra-550b-a55b:free – free OpenRouter tier, needs OPENROUTER_API_KEY
#   openrouter/openrouter/free                 – OpenRouter auto-router over whatever :free model fits
#   ollama/llama3                              – fully local/offline, needs Ollama running
# OpenRouter's free roster rotates — recheck the id still exists at
# openrouter.ai/models?max_price=0 if this starts erroring.
# Switch to a paid model (e.g. claude-opus-4-8, gpt-4o) here when desired.
provider:
  # Groq primary: direct inference (not a marketplace), fast, and its free
  # tier is meaningfully more generous than OpenRouter's zero-balance tier.
  # OpenRouter's free models absorb overflow once Groq's cap is hit.
  default_model: "groq/llama-3.3-70b-versatile"
  # Spread requests across two independent free tiers (Groq + OpenRouter) so
  # one provider's rate cap doesn't stall the whole run. With load_balance
  # on, every call round-robins across this list (default_model included);
  # if whichever model gets picked errors (e.g. a 429), LiteLLM automatically
  # retries the rest of the list in order before giving up.
  fallback_models:
    - "groq/llama-3.1-8b-instant"
    # gemini-2.5-pro was decommissioned for new API keys (404 from Google,
    # confirmed live 2026-08-11 through 2026-08-14) — replaced with the
    # still-live gemini-2.0-flash (see src/firm/llm/providers.py).
    - "gemini/gemini-2.0-flash"
    - "openrouter/openai/gpt-oss-20b:free"
    - "openrouter/nvidia/nemotron-3-super-120b-a12b:free"
    - "openrouter/google/gemma-4-31b-it:free"
    - "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
    - "openrouter/openrouter/free"   # last resort: auto-picks any live :free model
  load_balance: true
  temperature: 0.3
  max_tokens: 2000
  request_timeout: 90

optimization:
  compression_enabled: true
  compression_ratio: 0.5
  # Real LLMLingua-2 (installed) loads a ~700MB BERT model and costs 1-2s of
  # CPU-heavy inference per call — real contention with IB Gateway/live
  # trading on a small host. Only shrinks LLM prompt tokens (helps against
  # TPM rate caps), doesn't touch Voyage/embedding usage, no $ savings
  # against already-free-tier LLMs. Leave false for live trading; flip true
  # for an offline/backtest run where CPU contention doesn't matter.
  use_llmlingua: false
  cache_enabled: true
  cache_db: "data/llm_cache.db"
  cache_ttl_hours: 168

rag:
  persist_dir: "data/vectordb"
  # External (hosted) RAG models — no local torch/sentence-transformers needed.
  # Requires VOYAGE_API_KEY. To run fully local instead, set:
  #   embedding_provider: local   /   embedding_model: all-MiniLM-L6-v2
  #   reranker_provider:  local   /   reranker_model:  cross-encoder/ms-marco-MiniLM-L-6-v2
  # and install the optional `firm[local]` extra. Switching the embedding model
  # changes vector dimensionality, so a re-index (re-ingest) is required.
  embedding_provider: "voyage"          # "voyage" | "local"
  embedding_model: "voyage-finance-2"   # finance-tuned; 1024-dim
  reranker_provider: "voyage"           # "voyage" | "local" | "none"
  reranker_model: "rerank-2.5"
  chunk_size: 500
  chunk_overlap: 50
  reranking: false
  default_n_results: 5
  # Prepend a metadata header into embedded text (contextual retrieval).
  # Opt-in: toggling it changes chunk ids, so a re-index is required.
  contextual: false
  # Fuse an in-memory BM25 lexical channel with dense recall (RRF) before
  # reranking. Recovers exact-token matches (tickers, run-ids).
  hybrid: false
  # Source directory for the structured (DuckDB) run-query layer.
  runs_dir: "runs"

# Grounded QA assistant over backtest runs (firm.rag.assistant.TradingAssistant).
assistant:
  enabled: false
  # When the provider is Anthropic Claude, send the large static context with
  # cache_control so repeated questions over the same runs hit cached input.
  prompt_caching: true
  # Use the Claude Citations API to return verifiable source spans.
  citations: false
  n_results: 5

agent_modes:
  # Cost-optimized: only the two analysts with dedicated RAG corpora.
  # All other agents stay quant (no per-symbol LLM fan-out).
  technical_analyst: "quant"
  fundamental_analyst: "llm_enhanced"
  sentiment_analyst: "llm_enhanced"
  bull_researcher: "quant"
  bear_researcher: "quant"
  debate: "quant"
  trader: "quant"
  risk: "quant"

# Per-cycle LLM cost controls (see firm.agents.llm.base_llm_agent.LLMAgentMixin).
enhancement:
  policy: "live_calls"          # live: cache_only skips uncached calls
  min_abs_score: 0.2            # skip weak quant signals
  max_signals_per_agent: 8      # top |score| names per analyst per cycle
  min_conviction: 0.25
  max_theses_per_agent: 5
  max_debate_symbols: 5
  rag_n_results: 2              # smaller RAG context → fewer LLM tokens
  enhance_portfolio_review: false
  enhance_risk_review: false

backtest_policy: "cache_only"

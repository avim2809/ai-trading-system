# Default to a FREE model. Options that cost nothing to run:
#   groq/llama-3.3-70b-versatile  – free Groq tier, needs a free GROQ_API_KEY
#   ollama/llama3                 – fully local/offline, needs Ollama running
# Switch to a paid model (e.g. claude-opus-4-8, gpt-4o) here when desired.
provider:
  default_model: "groq/llama-3.3-70b-versatile"
  temperature: 0.3
  max_tokens: 2000

optimization:
  compression_enabled: true
  compression_ratio: 0.5
  cache_enabled: true
  cache_db: "data/llm_cache.db"
  cache_ttl_hours: 168

rag:
  persist_dir: "data/vectordb"
  # External (hosted) RAG models — no local torch/sentence-transformers needed.
  # Requires VOYAGE_API_KEY. To run fully local instead, set:
  #   embedding_provider: local   /   embedding_model: all-MiniLM-L6-v2
  #   reranker_provider:  local   /   reranker_model:  cross-encoder/ms-marco-MiniLM-L-6-v2
  # and install the optional `firm[local]` extra. Switching the embedding model
  # changes vector dimensionality, so a re-index (re-ingest) is required.
  embedding_provider: "voyage"          # "voyage" | "local"
  embedding_model: "voyage-finance-2"   # finance-tuned; 1024-dim
  reranker_provider: "voyage"           # "voyage" | "local" | "none"
  reranker_model: "rerank-2.5"
  chunk_size: 500
  chunk_overlap: 50
  reranking: true
  default_n_results: 5
  # Prepend a metadata header into embedded text (contextual retrieval).
  # Opt-in: toggling it changes chunk ids, so a re-index is required.
  contextual: false
  # Fuse an in-memory BM25 lexical channel with dense recall (RRF) before
  # reranking. Recovers exact-token matches (tickers, run-ids).
  hybrid: false
  # Source directory for the structured (DuckDB) run-query layer.
  runs_dir: "runs"

# Grounded QA assistant over backtest runs (firm.rag.assistant.TradingAssistant).
assistant:
  enabled: false
  # When the provider is Anthropic Claude, send the large static context with
  # cache_control so repeated questions over the same runs hit cached input.
  prompt_caching: true
  # Use the Claude Citations API to return verifiable source spans.
  citations: false
  n_results: 5

agent_modes:
  technical_analyst: "quant"
  fundamental_analyst: "quant"
  sentiment_analyst: "llm_enhanced"
  bull_researcher: "llm_enhanced"
  bear_researcher: "llm_enhanced"
  debate: "llm_enhanced"
  trader: "quant"
  risk: "quant"

backtest_policy: "cache_only"

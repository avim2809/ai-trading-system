universe:
  index: "SP500"
  min_market_cap: 1_000_000_000
  min_avg_volume: 500_000

backtest:
  start_date: "2018-01-01"
  end_date: "2023-12-31"
  initial_capital: 10_000_000
  commission_pct: 0.001
  slippage_pct: 0.0005
  rebalance_frequency: "weekly"

# Alpha strategies wired into the analysts. Leave empty/omit to enable ALL
# registered strategies. Example explicit selection including HMM regime:
#   strategies: ["momentum", "trend", "regime_hmm"]
strategies: []

# Portfolio allocation (TraderAgent) — backtest parity with config/live.yaml.
#   allocation_method: conviction_weighted | equal_weight | risk_parity | kelly
#   kelly_fraction only used when allocation_method: kelly (half-Kelly = 0.5)
allocation_method: conviction_weighted
kelly_fraction: 0.5

# Research signal combination:
#   method: confidence (default) | optimal (inverse-covariance weighting)
signal_combination:
  method: confidence

# Per-strategy params — mirrored in config/live.yaml for IBKR paper runs.
strategy_params:
  stat_arb:
    require_cointegration: true
    coint_pvalue: 0.10
    max_pairs: 5
    entry_z: 2.0
    exit_z: 0.5
    lookback_days: 60
    predefined_pairs:
      - ["SPY", "QQQ"]
      - ["SPY", "IWM"]
      - ["AAPL", "MSFT"]
      - ["JPM", "BAC"]
      - ["XOM", "CVX"]
      - ["GOOG", "META"]

risk:
  max_position_pct: 0.05        # 5% single-stock cap
  max_gross_exposure: 1.5       # 1.5× gross leverage
  max_net_exposure: 0.50        # 50% net long
  max_sector_pct: 0.25          # 25% sector cap
  vol_target: 0.12              # 12% annualised vol target
  max_drawdown_pct: 0.15        # 15% per-strategy drawdown stop

  sector_map:
    AAPL: technology
    MSFT: technology
    NVDA: technology
    GOOG: communication
    AMZN: consumer_discretionary
    META: communication
    TSLA: consumer_discretionary
    AVGO: technology
    AMD: technology
    CRM: technology
    NFLX: communication
    ADBE: technology
    JPM: financials
    GS: financials
    BAC: financials
    V: financials
    MA: financials
    JNJ: healthcare
    UNH: healthcare
    LLY: healthcare
    XOM: energy
    CVX: energy
    SPY: etf
    QQQ: etf
    IWM: etf

  # HMM regime overlay — conservative live-equivalent scaling
  regime_overlay:
    enabled: true
    benchmark_symbol: "SPY"
    n_states: 3
    retrain_frequency: 5
    lookback_days: 252
    exposure_map:
      Bull: 1.3
      Bear: 0.4
      Chop: 0.7

data:
  cache_dir: "data/cache"
  price_provider: "fallback"
  fundamental_provider: "fallback"
  sentiment_provider: "fallback"

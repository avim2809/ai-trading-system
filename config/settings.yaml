universe:
  index: "SP500"
  min_market_cap: 1_000_000_000
  min_avg_volume: 500_000

backtest:
  start_date: "2018-01-01"
  end_date: "2023-12-31"
  initial_capital: 10_000_000
  commission_pct: 0.001
  slippage_pct: 0.0005
  spread_pct: 0.0002           # bid-ask spread cost, charged per trade like commission
  short_borrow_annual_pct: 0.003  # annualized short-borrow fee, charged daily on short notional
  # Size/volume-aware market-impact cost (square-root law): impact_pct =
  # market_impact_coefficient * sqrt(trade_notional / ADV_dollars), on top of
  # the flat commission/slippage/spread rates above. 0.005 means a trade
  # equal to 100% of a name's ADV costs ~0.5% impact, ~0.16% at 10% of ADV
  # (RiskAgent's default max_participation_pct cap below) — a conservative
  # starting calibration; tune from realised fill data when available. See
  # firm.agents._liquidity.market_impact_pct.
  market_impact_coefficient: 0.005
  # Optional linear-below/sqrt-above crossover participation rate (None =
  # pure sqrt law at every size, unchanged default). See market_impact_pct's
  # docstring; uncomment once calibrated from realised fill data:
  # market_impact_crossover_participation: 0.1
  # No-trade / rebalance band (see firm.agents.execution.ExecutionAgent).
  # Matches config/live.yaml — validated via a 3-window backtest comparison
  # (2024-Q1/2022-Q1/2023-Q3, this live-faithful config): 0.05 cut daily
  # turnover 44-73% and improved/held drawdown in every window, with Sharpe
  # improving in 2/3 (one flipping negative to positive) and a noise-level
  # wash in the third. Keep below 2x risk.max_position_pct below — a band
  # at or above that is mechanically unreachable (no single-name swing can
  # exceed 2x the per-name cap) and would silently freeze the book forever.
  rebalance_band_pct: 0.05
  # Turnover-aware sizing -- mirrors config/live.yaml. Validated via a
  # 3-window comparison (2024-Q1/2022-Q1/2023-Q3, this live-faithful config):
  # 0.7 gave a clean Sharpe improvement over the band-only baseline in all 3
  # windows while cutting turnover another 34-54% beyond the band.
  rebalance_fraction: 0.7
  # Matches config/live.yaml's daily cadence -- previously "weekly" here,
  # which understated the turnover/whipsaw a daily-rebalancing live engine
  # actually produces (the whole reason this file is being made live-
  # faithful in the first place; a weekly-cadence backtest can't validate a
  # daily-cadence live turnover fix).
  rebalance_frequency: "daily"

# Alpha strategies wired into the analysts. Leave empty/omit to enable ALL
# registered strategies. Example explicit selection including HMM regime:
#   strategies: ["momentum", "trend", "regime_hmm"]
strategies: []

# Portfolio allocation (TraderAgent) — backtest parity with config/live.yaml.
#   allocation_method: conviction_weighted | equal_weight | risk_parity | kelly
#   kelly_fraction only used when allocation_method: kelly (half-Kelly = 0.5)
allocation_method: conviction_weighted
kelly_fraction: 0.5

# EMA smoothing on net_conviction before allocation (see
# firm.agents.trader.TraderAgent._smooth_convictions). Matches config/live.yaml
# — previously absent here entirely, so every backtest ran unsmoothed
# regardless of the live default, understating the turnover/whipsaw live
# actually produces. Enabled here so backtest Sharpe/turnover predict live.
conviction_smoothing_enabled: true
conviction_smoothing_halflife_days: 3.0

# Research signal combination:
#   method: confidence | optimal (inverse-covariance weighting)
# Default is `optimal` per docs/portfolio_construction_diagnosis.md — a 3-window
# A/B showed it beats `confidence` on portfolio Sharpe in every tested window.
signal_combination:
  method: optimal

# Generic per-strategy rolling-Sharpe circuit breaker (see
# firm.agents.research._circuit_breaker) — damps (never fully zeroes) a
# strategy's raw signal contribution when its trailing realized Sharpe is
# persistently and materially negative. Complementary to `optimal` above
# (which has no notion of a strategy's edge *sign*, only its variance/
# correlation), and originally motivated by regime_hmm's negative Sharpe in
# 6/6 diagnostic windows (docs/portfolio_construction_diagnosis.md).
# DISABLED BY DEFAULT: an A/B with these exact default thresholds over the
# same 3 diagnostic windows found it net *hurt* portfolio Sharpe in all 3
# (it over-gated several volatile-but-legitimate strategies on short
# windows using a noisy 60-day trailing Sharpe) — kept available for further
# calibration/research (see remediation backlog item
# `regime-conditional-weighting`), not enabled here.
strategy_circuit_breaker:
  enabled: false
  lookback_days: 60
  min_track_record_days: 20
  trigger_sharpe: -0.5
  full_cutoff_sharpe: -1.5
  damping_floor: 0.25

# Per-strategy score multipliers conditioned on market regime (off by default).
# Complements risk.regime_overlay (gross exposure) with pre-combination signal
# scaling. Example weights below are illustrative starting points from the
# portfolio-construction diagnosis — calibrate before enabling live.
# `ensemble: true` swaps the single-model regime detector for a 5-seed
# majority-vote ensemble (firm.regime.ensemble.EnsembleRegimeModel) — A/B'd
# in docs/regime_ensemble_scoping.md: calms regime_hmm's own noise but does
# NOT improve portfolio Sharpe with this feature enabled, so left false.
strategy_regime_weights:
  enabled: false
  ensemble: false
  benchmark_symbol: SPY
  lookback_days: 252
  retrain_frequency: 21
  weights:
    Bull:
      momentum: 1.2
      trend: 1.2
      mean_reversion: 0.8
    Bear:
      stat_arb: 1.2
      mean_reversion: 1.1
      momentum: 0.7
      trend: 0.7
    Chop:
      regime_hmm: 0.5
      volatility_breakout: 0.8

# Per-strategy params — mirrored in config/live.yaml for IBKR paper runs.
strategy_params:
  stat_arb:
    require_cointegration: true
    coint_pvalue: 0.10
    max_pairs: 5
    entry_z: 2.0
    exit_z: 0.5
    lookback_days: 60
    predefined_pairs:
      - ["SPY", "QQQ"]
      - ["SPY", "IWM"]
      - ["AAPL", "MSFT"]
      - ["JPM", "BAC"]
      - ["XOM", "CVX"]
      - ["GOOG", "META"]

risk:
  max_position_pct: 0.05        # 5% single-stock cap
  max_gross_exposure: 1.5       # 1.5× gross leverage
  max_net_exposure: 0.50        # 50% net long
  max_sector_pct: 0.25          # 25% sector cap
  vol_target: 0.12              # 12% annualised vol target
  # Was silently dead code -- see config/live.yaml for the full story.
  # De-risk only (never levers up past other caps), safe to enable.
  vol_targeting_enabled: true
  vol_lookback_days: 60
  max_drawdown_pct: 0.15        # 15% per-strategy drawdown stop

  # ADV/participation-rate liquidity cap — mirrors config/live.yaml so
  # backtest Sharpe reflects the same constraint that would bind live.
  # See RiskAgent._cap_liquidity.
  max_participation_pct: 0.10
  adv_lookback_days: 20

  # Pairwise-correlation concentration cap (see RiskAgent._cap_correlated_
  # exposure) — matches config/live.yaml. Previously left off here
  # specifically to preserve comparability with the backtest numbers already
  # recorded in docs/portfolio_construction_diagnosis.md; that diagnosis is
  # being deliberately superseded by a fresh live-faithful baseline (2026-08
  # execution/construction remediation), so parity with live now takes
  # priority over comparability with the old numbers.
  correlation_threshold: 0.75
  max_correlated_pair_pct: 0.25
  correlation_lookback_days: 60

  # Optional CVaR (Conditional Value-at-Risk / Expected Shortfall) tail-risk
  # sizing overlay — complements vol_target's diagonal-covariance estimate
  # with a distributional tail read. Off by default pending a dedicated A/B
  # (same rationale as correlation_threshold above: don't move already-
  # recorded backtest numbers without a fresh, deliberate comparison). See
  # RiskAgent._cvar_overlay / firm.eval.metrics.conditional_value_at_risk.
  # cvar_limit: 0.03
  # cvar_confidence: 0.95
  # cvar_lookback_days: 60

  sector_map:
    AAPL: technology
    MSFT: technology
    NVDA: technology
    GOOG: communication
    AMZN: consumer_discretionary
    META: communication
    TSLA: consumer_discretionary
    AVGO: technology
    AMD: technology
    CRM: technology
    NFLX: communication
    ADBE: technology
    JPM: financials
    GS: financials
    BAC: financials
    V: financials
    MA: financials
    JNJ: healthcare
    UNH: healthcare
    LLY: healthcare
    XOM: energy
    CVX: energy
    SPY: etf
    QQQ: etf
    IWM: etf

  # HMM regime overlay — conservative live-equivalent scaling
  regime_overlay:
    enabled: true
    benchmark_symbol: "SPY"
    n_states: 3
    retrain_frequency: 5
    lookback_days: 252
    # `ensemble: true` swaps in the 5-seed majority-vote regime detector
    # (firm.regime.ensemble.EnsembleRegimeModel). Only A/B'd against
    # strategy_regime_weights so far (docs/regime_ensemble_scoping.md) —
    # not this overlay specifically — so left false pending its own A/B.
    ensemble: false
    exposure_map:
      Bull: 1.3
      Bear: 0.4
      Chop: 0.7

data:
  cache_dir: "data/cache"
  price_provider: "fallback"
  fundamental_provider: "fallback"
  sentiment_provider: "fallback"

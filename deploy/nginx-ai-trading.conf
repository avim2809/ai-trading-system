# Reverse-proxy template for the two live paper-trading instances
# (ai-trading.service on :8000, ai-trading-alpaca.service on :8001).
# Install at /etc/nginx/sites-available/ai-trading and symlink into
# sites-enabled — see DEPLOY.md §6e for the cert/htpasswd/rate-limit setup
# this file depends on. Swap `server_name _;` for a real domain if using
# certbot instead of a self-signed cert.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/ai-trading.crt;
    ssl_certificate_key /etc/nginx/ssl/ai-trading.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "AI Trading System";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Rate limit + security headers — see nginx-rate-limit.conf for the zone
    # definition and rationale.
    limit_req zone=ai_trading_limit burst=20 nodelay;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Lets the single React build (served below from the IBKR instance) reach
    # the Alpaca instance's API without a second page load — the frontend
    # picks this prefix vs plain /api based on a client-side instance toggle
    # (see frontend/src/api/client.ts). Only the API is prefixed, not the
    # whole app, so this doesn't hit the root-absolute-asset-path problem the
    # 8443 server block's comment describes.
    location /api/alpaca/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE/streaming-friendly settings (harmless for regular requests).
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

# Parallel Alpaca paper-trading instance (ai-trading-alpaca.service, port
# 8001). Separate external port rather than a /alpaca/ path prefix under the
# same server block — the frontend/dist build is shared between both
# instances and its assets use root-absolute paths, so a path prefix would
# break asset loading without a second, differently-based frontend build.
# Same TLS cert, basic-auth file, and rate-limit zone as the main instance.
server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/ai-trading.crt;
    ssl_certificate_key /etc/nginx/ssl/ai-trading.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "AI Trading System (Alpaca)";
    auth_basic_user_file /etc/nginx/.htpasswd;

    limit_req zone=ai_trading_limit burst=20 nodelay;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

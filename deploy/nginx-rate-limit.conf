# Per-client-IP request-rate limit for the ai-trading site. Basic auth
# (auth_basic) has no built-in throttling of its own, so without this a
# brute-force password-guessing script could hit the login as fast as the
# network allows. 10r/s steady-state is generous for normal dashboard
# polling (the frontend's fastest poll interval is ~5s per endpoint); the
# burst below absorbs a normal page load's simultaneous requests.
#
# Install at /etc/nginx/conf.d/rate-limit.conf.
limit_req_zone $binary_remote_addr zone=ai_trading_limit:10m rate=10r/s;

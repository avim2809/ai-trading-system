[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firm"
version = "0.1.0"
description = "Multi-agent AI stock investment firm – backtested alpha strategies with point-in-time data integrity"
requires-python = ">=3.14"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "backtrader",
    "hmmlearn",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "pyarrow",
    "requests",
    "statsmodels",
    # Joint constrained portfolio optimizer (src/firm/portfolio/optimizer.py)
    # -- expresses the L1 transaction-cost term, the sqrt-market-impact
    # (3/2-power) term, and the SOC vol constraint exactly, with real solver
    # status/failure reporting. See PART 2 of the remediation plan
    # (docs/remediation_progress.md) for why this was chosen over
    # scipy.optimize (already a dependency but needs manual reformulation of
    # the convex terms).
    "cvxpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "httpx",
]
api = [
    "fastapi",
    "uvicorn[standard]",
    "prometheus-fastapi-instrumentator>=7.0",
]
live = [
    "alpaca-py",
    "ib_async",
    "apscheduler>=3.10",
]
llm = [
    "litellm>=1.40",
    "tiktoken",
    "chromadb>=0.5",
    "voyageai>=0.2",
    "feedparser",
    "duckdb>=0.10",
    "rank-bm25",
    # Real (non-fallback) prompt compression for TokenCompressor. Pulls
    # torch — on a CPU-only host, install torch from the CPU wheel index
    # first (pip install torch --index-url https://download.pytorch.org/whl/cpu)
    # or this pulls the much larger CUDA build.
    "llmlingua",
]
# Optional: run RAG embeddings/reranking locally (pulls torch — large, ~2GB RAM).
# Not needed when using the default hosted Voyage provider.
local = [
    "sentence-transformers",
]
# Optional: QuantStats HTML tear-sheet reporting (firm.eval.tearsheet).
report = [
    "quantstats>=0.0.62",
]
# Optional: Investing.com Pro authenticated scraper (firm.data.investing).
# Off by default (INVESTING_SCRAPER_ENABLED unset) — this extra is only
# needed once that feature is actually enabled. See
# docs/investing_pro_integration.md. `playwright` drives every fetch, not
# just login — a plain `requests` client gets HTTP 403 even on public pages
# (confirmed empirically; investing.com blocks non-browser clients at the
# edge), so there's no lighter-weight fallback for the GET path either. One
# Chromium instance is launched and reused across all fetches within a run
# (InvestingSession.close() / a `with` block tears it down), bounding the
# ~300-500MB RAM cost to once per live cycle (once/day) rather than per
# request. After installing this extra, run `playwright install chromium`.
investing = [
    "beautifulsoup4>=4.12",
    "playwright>=1.48",
]

[project.scripts]
fetch-data = "firm.scripts.fetch_data:main"
run-backtest = "firm.scripts.run_backtest:main"
firm-api = "firm.api.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Silence third-party deprecation warnings we can't fix from here, so CI logs
# stay readable. Matched by message prefix, so our own warnings still surface.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:SelectableGroups dict interface is deprecated",
    "ignore:hf_xet.download_files",
    # chromadb's telemetry decorator still calls the stdlib-deprecated
    # asyncio.iscoroutinefunction (removed in Python 3.16); fixed upstream
    # (chroma-core/chroma#6740) but not yet released as of chromadb 1.5.9.
    # Revisit/drop this once we upgrade past the release containing that fix.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:chromadb",
    # chromadb logs a legacy-config DeprecationWarning for any embedding
    # function (e.g. our VoyageEmbeddingFunction) that predates its
    # `is_legacy` attribute convention; harmless, and not something we can
    # add to a third-party class.
    "ignore:legacy embedding function config:DeprecationWarning:chromadb",
    # hmmlearn (regime_hmm strategy dependency) still assigns ndarray.shape
    # in place, deprecated under NumPy >=2.5; fix is upstream, not ours.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:hmmlearn",
    # seaborn's heatmap/tear-sheet rendering calls Colormap.set_bad(), whose
    # signature is being deprecated in a future matplotlib; not our call site.
    "ignore:The set_bad function will be deprecated:PendingDeprecationWarning",
    # seaborn's categorical boxplot still passes the now-deprecated `vert`
    # kwarg through to matplotlib's Axes.bxp(); not our call site.
    "ignore:vert. bool was deprecated:matplotlib.MatplotlibDeprecationWarning",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firm"
version = "0.1.0"
description = "Multi-agent AI stock investment firm – backtested alpha strategies with point-in-time data integrity"
requires-python = ">=3.14"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "backtrader",
    "hmmlearn",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "pyarrow",
    "requests",
    "statsmodels",
    # CPU-only ONNX inference for the pattern_recognition strategy's CNN/GAF
    # quality scorer (firm.patterns.ml.inference) -- deliberately a direct,
    # declared dependency rather than relying on it arriving transitively via
    # chromadb (the `llm` extra): pattern_recognition is enabled in both live
    # configs today and should get CNN scoring on a plain `pip install -e .`
    # too. Confirmed a genuine cp314 wheel exists as of 2026-09-09
    # (docs/pattern_recognition_plan.md's "no Python 3.14 wheel yet" note is
    # now stale) and that it was already installed+importable here at
    # ~40MB RSS/~0.1s import time -- negligible next to this host's 2-core/
    # 3.3GB constraint. Training itself still needs torch/pyts, which do NOT
    # have cp314 wheels and stay confined to the isolated .venv-ml
    # environment (see firm.patterns.ml.cnn_validator) -- this is inference
    # (CPUExecutionProvider) only, never added here.
    "onnxruntime",
    # Joint constrained portfolio optimizer (src/firm/portfolio/optimizer.py)
    # -- expresses the L1 transaction-cost term, the sqrt-market-impact
    # (3/2-power) term, and the SOC vol constraint exactly, with real solver
    # status/failure reporting. See PART 2 of the remediation plan
    # (docs/remediation_progress.md) for why this was chosen over
    # scipy.optimize (already a dependency but needs manual reformulation of
    # the convex terms).
    "cvxpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    # Pinned: ruff 0.16 changed its implicit default rule set, so an unpinned
    # install makes CI lint results drift from the host. Keep == review/requirements-lock.txt.
    "ruff==0.16.8",
    "httpx",
]
api = [
    "fastapi",
    "uvicorn[standard]",
    "prometheus-fastapi-instrumentator>=7.0",
]
live = [
    "alpaca-py",
    "ib_async",
    "apscheduler>=3.10",
]
llm = [
    "litellm>=1.40",
    "tiktoken",
    "chromadb>=0.5",
    "voyageai>=0.2",
    "feedparser",
    "duckdb>=0.10",
    "rank-bm25",
    # Real (non-fallback) prompt compression for TokenCompressor. Pulls
    # torch — on a CPU-only host, install torch from the CPU wheel index
    # first (pip install torch --index-url https://download.pytorch.org/whl/cpu)
    # or this pulls the much larger CUDA build.
    "llmlingua",
]
# Optional: run RAG embeddings/reranking locally (pulls torch — large, ~2GB RAM).
# Not needed when using the default hosted Voyage provider.
local = [
    "sentence-transformers",
]
# Optional: QuantStats HTML tear-sheet reporting (firm.eval.tearsheet).
report = [
    "quantstats>=0.0.62",
]
# Optional: XGBoost confirmation classifier for the pattern-recognition
# strategy's ML layer (firm.patterns.ml -- Phase 4 of
# docs/pattern_recognition_plan.md, deliberately scoped to just this
# classifier: no CNN/GAF image validator, no PPO RL sizer, which would need
# torch/stable-baselines3/gymnasium/pyts). See scripts/train_pattern_ml.py.
# NOTE: on Linux, xgboost's PyPI wheel pulls in `nvidia-nccl-cu13` (~290MB) as
# a transitive dependency even for pure-CPU use -- it's an unused multi-GPU
# communication library. `pip uninstall -y nvidia-nccl-cu13` right after
# installing this extra is safe and recommended, especially on a
# disk/RAM-constrained host: CPU training/inference never touches it.
patterns_ml = [
    "xgboost>=2.0",
]
# Optional: Investing.com Pro authenticated scraper (firm.data.investing).
# Off by default (INVESTING_SCRAPER_ENABLED unset) — this extra is only
# needed once that feature is actually enabled. See
# docs/investing_pro_integration.md. `playwright` drives every fetch, not
# just login — a plain `requests` client gets HTTP 403 even on public pages
# (confirmed empirically; investing.com blocks non-browser clients at the
# edge), so there's no lighter-weight fallback for the GET path either. One
# Chromium instance is launched and reused across all fetches within a run
# (InvestingSession.close() / a `with` block tears it down), bounding the
# ~300-500MB RAM cost to once per live cycle (once/day) rather than per
# request. After installing this extra, run `playwright install chromium`.
investing = [
    "beautifulsoup4>=4.12",
    "playwright>=1.48",
]

[project.scripts]
fetch-data = "firm.scripts.fetch_data:main"
run-backtest = "firm.scripts.run_backtest:main"
firm-api = "firm.api.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"


# Ledger accounting: n_planned_trials is capped by the schema at max_grid_size (12). The P3-11 estimation trials (kind
# constant_estimation) and the P3-08 robustness / cost_stress / stress_suite / benchmark / comparison runs are ADDITIONAL ledger
# trials; they are enumerated with expected counts in scripts/core_v1_preregistered.py and all count toward N (OD-09, raw count).
family: core_v1
hypothesis: >-
  A long/flat, volatility-scaled, diversified time-series trend portfolio (EWMAC plus breakout rules on the 14-ETF universe,
  gross <= 1.0x, no leverage, no carry) earns, after realistic costs and Israeli tax, a net Sharpe ratio above that of the 60/40
  SPY/IEF benchmark with annual rebalancing (BM2) over the pre-seal window, and passes every G-RESEARCH test in the frozen gates.
mechanism_ref: research/charters/core_v1.md
universe: [SPY, IWM, QQQ, EFA, EEM, SHY, IEF, TLT, TIP, LQD, HYG, GLD, DBC, IYR]   # = config/universe_etf.yaml, in file order
date_range: ["1994-02-02", "2026-09-30"]   # earliest first_trade_date in the universe .. burned_through; an instrument enters after its 256-day gate
param_grid:                                # 2 x 3 x 2 = 12 configs
  forecast_cap: [15.0, 20.0]
  buffer_fraction: [0.05, 0.1, 0.2]
  speed_subset: [all, drop_fastest]
max_grid_size: 12
n_planned_trials: 12
metrics:
  - net_sharpe
  - deflated_sharpe
  - pbo_s16
  - prob_oos_loss
  - cpcv_median_path_sharpe
  - cpcv_positive_paths_of_9
  - net_sharpe_at_2x_cost
  - deflated_sharpe_at_2x_cost
  - stress_episode_max_drawdown_vs_bootstrap_p95
  - robustness_min_ratio_to_chosen_net_sharpe
  - share_of_days_at_gross_cap
  - after_tax_after_cost_sharpe_vs_bm2
  - correlation_to_bm2
  - effective_number_of_bets
gates_hash: bcecaec9ef44163596e27459779a124747d382c8068bf0607d4793df79f71540   # plain-file sha256 of the gates file (gates version 2, Amendment 1, 2026-10-06)
charter_ref: research/charters/core_v1.md
falsification: >-
  The hypothesis is rejected (and the accepted outcome is the passive portfolio, BM2 or the owner's 92/8 book) if the frozen
  gates yield Tier D, or Tier C, or an H4 ENB miss (ENB < 2.5): any of net Sharpe <= 0, median CPCV path <= 0,
  net Sharpe <= 0 at 2x cost, PBO >= 0.5 with prob_oos_loss >= 0.5, a stress-episode loss above 1.5x the bootstrap p95 reference,
  a +/-25% parameter perturbation cutting net Sharpe below 70% of the chosen value, more than 20% of days at the gross cap, after-tax
  after-cost Sharpe not above BM2 (with correlation to BM2 above 0.3), DSR below 0.95 at the raw trial count N, or fewer than 7 of
  9 positive CPCV paths. Only Tier A supports a claim of no contradiction with an edge. No re-run, grid change or threshold change
  after viewing any result; any change is a new pre-registration.
post_seal_data_declaration: No data after 2026-09-30 was examined.
approver: "Avi Milner"

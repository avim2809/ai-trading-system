# DRAFT for research/preregistration/<YYYYMMDD>_core_v1.yaml (owner-committed; agents never write there).
# Schema: firm.research.prereg.PreregSpec (P1-09). Tickets: P3-11 (constants), P3-08 (G-RESEARCH run).
# Written WITHOUT any backtest, any data read, or any performance input. The grid values below are fixed by rationale only:
#   * forecast_cap: 20 is the gates.yaml robustness_parameters value (Carver convention); 15 is a tighter alternative.
#   * buffer_fraction: 0.10 is the gates.yaml value; 0.05 and 0.20 bracket it by a factor of 2.
#   * speed_subset: "all" = six EWMAC fast spans (2,4,8,16,32,64; slow = 4x fast) + five breakout lookbacks (20,40,80,160,320);
#     "drop_fastest" removes EWMAC 2 and 4 and breakout 20, the three rules most exposed to cost (turnover), stated ex ante.
#   The default gates.yaml configuration (cap 20, buffer 0.10, all speeds) is inside the grid. tau is NOT a grid dimension (OD-17:
#   fixed in the charter, working value 9%).
# Frozen inputs that this schema has no field for (to be recorded in scripts/core_v1_preregistered.py, which P3-11 freezes
# BEFORE any run, and re-verified by P3-08 step 1). sha256 at drafting time (2026-10-05); the owner must re-check at approval:
#   Gates version 2 (owner-signed Amendment 1, 2026-10-06): the gate-7 benchmark is the PINNED ANNUAL BM2 variant
#   (gate_variant: annual, uses_higher_after_tax_sharpe_of_the_two: false); monthly BM2 is a reported sensitivity only.
#   The gates_hash below is the plain-file sha256 (re-computed 2026-10-06); universe, stress and tax hashes were re-verified unchanged.
#   config/universe_etf.yaml    379cb0d4611f46561b1125c72276803ea590ab3de136bcfb3d0ce6a9696d3514   (frozen 14-ETF universe, 2026-10-05)
